name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../web
      - run: npm run build --prefix ../web
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../cli/test/*.test.mjs
      - name: Database guard (all migrations)
        run: |
          node --test ../scripts/test/*.test.mjs
          node ../scripts/check-migrations.mjs --all
  linux-receipt-uploads:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install HEIC-capable ImageMagick
        run: |
          apt-get update
          apt-get install -y --no-install-recommends imagemagick
          convert -list format | grep -E 'HEIC.*rw'
      - run: npm ci --prefix worker
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Upload large receipts through the CLI to local D1
        env:
          SPLIT_TEST_RECEIPTS: '1'
          SPLIT_TEST_RECEIPT_PHOTOS: '1'
        run: node --test cli/test/receipt-integration.test.mjs
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test with Xcode 27.2
        run: |
          xcodebuild -version
          xcodebuild test -project Split.xcodeproj -scheme Split \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            OTHER_CODE_SIGN_FLAGS=--strip-disallowed-xattrs
