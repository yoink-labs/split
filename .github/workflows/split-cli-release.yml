name: Release Split CLI
on:
  push:
    tags: ['split-v*']
    branches: [main]
    paths:
      - 'cli/bin/**'
      - 'cli/lib/**'
      - 'cli/split.mjs'
      - 'cli/package.json'
      - 'cli/release/**'
      - '.github/workflows/split-cli-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI release tag to retry (leave blank to check main)
        required: false
permissions:
  contents: write
concurrency:
  group: publish-split-cli
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yoink-labs/split' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      TAP: yoink-labs/homebrew-tap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        name: Test and package the next CLI release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(bash cli/release/next-tag.sh)"
            if [[ -z "$tag" ]]; then
              echo "The latest release includes all CLI changes."
              exit 0
            fi
          fi
          [[ "$tag" =~ ^split-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            git switch --detach "refs/tags/$tag"
          elif [[ "$GITHUB_REF_TYPE" == tag || -n "$REQUESTED_TAG" ]]; then
            echo "Release tag $tag does not exist." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          node --test cli/test/*.test.mjs
          cli/release/package.sh "$tag" dist
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the source repository release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: cli/release/publish-asset.sh "$GITHUB_REPOSITORY" "$TAG" dist/*.tar.gz
      - uses: actions/checkout@v4
        if: steps.version.outputs.tag != ''
        with:
          repository: yoink-labs/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish public asset and update tap
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cli/release/publish-asset.sh "$TAP" "$TAG" dist/*.tar.gz
          mkdir -p tap/Formula
          if [[ -f tap/Formula/split.rb ]]; then
            current=$(sed -nE 's@^ +url ".*releases/download/(split-v[0-9]+\.[0-9]+\.[0-9]+)/.*@\1@p' tap/Formula/split.rb)
            if [[ "$(printf '%s\n' "$TAG" "$current" | sort -V | tail -n 1)" != "$TAG" ]]; then
              echo "Homebrew already serves $current."
              exit 0
            fi
          fi
          cp dist/split.rb tap/Formula/split.rb
          git -C tap add Formula/split.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish $TAG"
            git -C tap push origin HEAD:main
          fi
