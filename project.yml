name: Split
options:
  bundleIdPrefix: com.yoinklabs
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: '1.7.1'
targets:
  Split:
    type: application
    platform: iOS
    sources:
      - path: Split
        excludes:
          # StoreKit testing config: used by the scheme and unit tests, never
          # shipped in the app bundle.
          - Resources/Split.storekit
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: Clerk
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoinklabs.split
        MARKETING_VERSION: '0.8.0'
        CURRENT_PROJECT_VERSION: '12'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Split/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Split
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 64PUT29XZ8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Split/Resources/Split.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      # Local tip products for simulator and Xcode runs. The real products
      # live in App Store Connect under the same ids.
      storeKitConfiguration: Split/Resources/Split.storekit
      testTargets: [SplitTests]
  SplitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SplitTests
      # Bundled so a test can check the config matches the code's product ids.
      - path: Split/Resources/Split.storekit
        buildPhase: resources
    dependencies:
      - target: Split
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yoinklabs.split.tests
